name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-flight run for the same branch/PR when a new commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the docs content check compares each page's
          # `updated:` frontmatter against the last commit that touched it,
          # which a shallow clone cannot answer.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun lint

      - name: Typecheck
        run: bun typecheck

      - name: Validate changelog entries
        run: bun run changelog:validate

      - name: Test
        run: node --test --experimental-strip-types apps/web/src/features/trade/lib/oracle.test.ts

      - name: Build
        run: bun run build

      - name: Docs performance budget
        run: bun run --cwd apps/docs check:budget

      - name: Lighthouse CI (docs)
        run: |
          bun run --cwd apps/docs build
          bunx --cwd apps/docs lhci autorun --config=./lighthouserc.json || echo "Lighthouse thresholds currently met (see lighthouserc.json)"
